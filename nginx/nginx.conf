user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr" $request_time';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # LOAD BALANCER UPSTREAMS
    upstream room_backend {
        server room-service-1:8083 max_fails=3 fail_timeout=10s;
        server room-service-2:8083 max_fails=3 fail_timeout=10s;
    }

    upstream booking_backend {
        server booking-service-1:8082 max_fails=3 fail_timeout=10s;
        server booking-service-2:8082 max_fails=3 fail_timeout=10s;
    }

    upstream auth_backend {
        server auth-service:8080;
    }

    upstream user_backend {
        server user-service:8081;
    }

    upstream payment_backend {
        server payment-service:8084;
    }

    server {
        listen 80;
        server_name localhost;

        # Static Frontend
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # API Proxy with Load Balancing
        location /api/rooms/ {
            proxy_pass http://room_backend/rooms/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Served-By $upstream_addr always;
        }

        location /api/bookings/ {
            proxy_pass http://booking_backend/bookings/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Served-By $upstream_addr always;
        }

        location /api/auth/ {
            proxy_pass http://auth_backend/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/users/ {
            proxy_pass http://user_backend/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/payments/ {
            proxy_pass http://payment_backend/payments/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
