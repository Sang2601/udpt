spring.application.name=user-service

# SERVER
server.port=${PORT:8081}

# H2 PERSISTENT DATABASE (AUTO_SERVER allows multi-instance concurrent access)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/userdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# HIKARICP CONNECTION POOL & FAULT TOLERANCE
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 CONSOLE
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ACTUATOR & HEALTH MONITORING
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
