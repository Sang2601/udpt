global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend cockroach_cluster_in
    bind *:26257
    mode tcp
    default_backend cockroach_cluster_nodes

backend cockroach_cluster_nodes
    mode tcp
    balance roundrobin
    option httpchk GET /health?ready=1
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server roach1 roach1:26257 check port 8080
    server roach2 roach2:26257 check port 8080
    server roach3 roach3:26257 check port 8080
